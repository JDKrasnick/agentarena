name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.8.0

jobs:
  quality:
    name: Quality, coverage, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit and integration coverage
        run: npm run test:coverage

      - name: Verify package API and contents
        run: npm run test:package

  test:
    name: Tests on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm run test:unit && npm run test:integration

      - name: Run built CLI smoke test
        run: npm run test:smoke

  artifact-schema-and-delivery:
    name: Artifact schemas and fake GitHub delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Check artifact schema fixtures
        run: npm run test:unit -- test/unit/outcome.test.ts test/unit/review-ledger.test.ts test/unit/delivery-ledger.test.ts

      - name: Check fake GitHub delivery
        run: npm run test:integration -- test/integration/github-delivery.test.ts test/integration/merge-monitor.test.ts

  browser-runtime:
    name: Browser runtime with preinstalled Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies without browser downloads
        run: npm ci

      - name: Exercise the preinstalled browser
        env:
          ARENA_REAL_BROWSER: "1"
          CHROME_BIN: google-chrome
        run: npm run test:integration -- test/integration/browser-runtime.test.ts

  process-timeout-reproduction:
    name: Process timeout reproduction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Reproduce escaped-descendant timeout leakage
        run: npm run test:process-timeout-repro
